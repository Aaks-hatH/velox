# Puts Velox Health online with Render (render.com), straight from this GitHub repository.
# In Render: New + > Blueprint > pick this repository. Every push to main redeploys it.
services:
  - type: web
    name: velox-health
    runtime: python
    plan: free
    rootDir: python-app
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --threads 4 --bind 0.0.0.0:$PORT
    healthCheckPath: /onboarding
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: PUBLIC_DEMO        # demo data only, uploads off: it's a shared server
        value: "1"
      - key: SECRET_KEY         # signs each visitor's settings cookie; Render makes a random one
        generateValue: true
